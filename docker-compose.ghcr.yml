  #  container_name: napcat
  #  restart: unless-stopped
  #  environment:
  #    TZ: Asia/Shanghai
  #    #ACCOUNT: "123456789"                  # 预填要登录的 QQ(也可 WebUI 扫码)
  #  ports:
  #    - "6090:6090"                          # WebUI
  #    # HTTP 3000 建议不对外映射, 走 compose 内网即可
  #  volumes:
  #    - ./napcat/QQ:/app/.config/QQ          # QQ 登录态
  #    - ./napcat/napcat:/app/napcat/config   # NapCat 配置
