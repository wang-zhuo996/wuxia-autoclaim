# wuxia-autoclaim 配置模板(UTF-8)
# 用法: 复制一份改名成同目录下的 config.yaml 再改; 文件不存在时全默认(config show 可看生效值)。
# roles.json 只存机器状态(角色/凭据), 由工具自动维护, 不要手工编辑。

napcat:                       # NapCat OneBot HTTP 端点(可多个, 部署见 README)
    - url: http://127.0.0.1:3000
      token: "xxxx"           # NapCat WebUI 里设置的 access token; 纯数字 token 务必带引号
                               # NapCat 在远程服务器时, 可用 ssh -L 3000:localhost:3000 隧道,
                               # 容器内监听地址需 0.0.0.0 且宿主映射收紧到 127.0.0.1
game_dir: ""                  # 游戏 QBrowser/QCache 目录(仅 game 通道, 一般留空)
channel_order: [napcat, qqnt] # 凭据收割通道顺序(可用: napcat/qqnt)
auto_bind: false              # 收割到新 QQ 时自动补齐绑定(需活动已有绑定或 bind 预设)
gift_index: 3                 # 默认许愿奖励序号(1 起); 想换物品跑 gift 命令最直观
push_key: ""                  # Server酱 SendKey(空 = 不推送)
#gift_override:               # 按 QQ 覆盖奖励序号(优先于 gift_index, gift 命令自动维护)
#    123456789: 2
#bind:                        # 自动绑定预设 QQ号 -> 服务器/角色名; bind/harvest --bind-new 免交互直绑
#    123456789:
#        server: 凤凰集       # 服务器名, 要与大区表一致(如 凤凰集/长生剑)
#        role: 测试一         # 该服务器上的角色名
